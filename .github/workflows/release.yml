name: 构建并发布完整包

# 推送 v* 标签时自动构建「含运行时」完整包并创建 Release
# 本地发版：git tag v1.0.2 && git push origin v1.0.2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（如 v1.0.2）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取锁定版本（单一数据源：安装脚本）
        id: ver
        shell: pwsh
        run: |
          $ps1 = Get-Content scripts/setup-windows.ps1 -Raw
          $node = [regex]::Match($ps1, "\`$NodeVersion\s*=\s*'([^']+)'").Groups[1].Value
          $dsh  = [regex]::Match($ps1, "\`$DshVersion\s*=\s*'([^']+)'").Groups[1].Value
          if (-not $node -or -not $dsh) { throw "无法从 setup-windows.ps1 解析版本号" }
          "node=$node"  >> $env:GITHUB_OUTPUT
          "dsh=$dsh"    >> $env:GITHUB_OUTPUT
          Write-Host "Node=$node  dsh=$dsh"

      - name: 下载便携 Node.js
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.node }}"
          New-Item -ItemType Directory -Force -Path .cache/runtimes/windows-x64, .cache/downloads | Out-Null
          $zip = ".cache/downloads/node-v$v-win-x64.zip"
          if (-not (Test-Path $zip)) {
            Write-Host "下载 Node $v ..."
            Invoke-WebRequest "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip" -OutFile $zip -UseBasicParsing
          }
          Expand-Archive $zip -DestinationPath .cache/runtimes/_extract -Force
          Move-Item ".cache/runtimes/_extract/node-v$v-win-x64" .cache/runtimes/windows-x64/node
          & .cache/runtimes/windows-x64/node/node.exe -v

      - name: 安装 @deepseek-ai/dsh
        shell: pwsh
        run: |
          $dsh = "${{ steps.ver.outputs.dsh }}"
          $npm = ".cache/runtimes/windows-x64/node/npm.cmd"
          & $npm install --prefix .cache/app "@deepseek-ai/dsh@$dsh" `
            --no-audit --no-fund --fetch-retries=5 --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "dsh 安装失败" }

      - name: 补齐 peer 依赖包（列表从安装脚本解析，避免两处维护）
        shell: pwsh
        run: |
          $npm = ".cache/runtimes/windows-x64/node/npm.cmd"
          $ps1 = Get-Content scripts/setup-windows.ps1 -Raw

          # 从 $PeerFix 数组提取包列表，并剔除注释行里的误匹配
          $m = [regex]::Match($ps1, '\$PeerFix\s*=\s*@\((.*?)\n\s*\)',
                [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $m.Success) { throw "无法从 setup-windows.ps1 解析 PeerFix 列表" }
          $peers = @([regex]::Matches($m.Groups[1].Value, "'([^']+)'") |
                     ForEach-Object { $_.Groups[1].Value } |
                     Where-Object { $_ -match '[@^]' })

          if ($peers.Count -lt 20) { throw "解析到的 peer 数量异常: $($peers.Count)" }
          Write-Host "解析到 $($peers.Count) 个 peer 包："
          $peers | ForEach-Object { Write-Host "  - $_" }

          # 一致性校验：peer 里的 dsh-* 版本必须与 DSH_VERSION 一致，否则装出混合版本
          $dshVer = "${{ steps.ver.outputs.dsh }}"
          $mismatch = $peers | Where-Object { $_ -match '^@deepseek-ai/dsh-.*@\^(.+)$' -and $Matches[1] -ne $dshVer }
          if ($mismatch) { throw "peer 版本与 dsh@$dshVer 不一致: $($mismatch -join ', ')" }

          & $npm install --prefix .cache/app @peers --no-audit --no-fund --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "peer 补齐失败" }

      - name: 应用品牌补丁
        shell: pwsh
        run: |
          $dst = ".cache/app/node_modules/@deepseek-ai"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "brand-patch/@deepseek-ai/*" $dst -Recurse -Force
          if (-not (Select-String -Path "$dst/dsh-client-ui-brand-official/lib/client.js" -Pattern 'USB Harness' -Quiet)) {
            throw "品牌补丁未生效"
          }
          Write-Host "品牌补丁已应用"

      - name: 校验补丁基线（必须与锁定的 dsh 版本一致）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8   # 避免 Windows 控制台 cp1252 编码中文报错
        run: |
          # 断言 brand-patch 的改写基线 == 本次安装的 dsh 版本。
          # 不一致说明「装了新版本、却打着旧版本的补丁」，启动会 ERR_MODULE_NOT_FOUND。
          $dshVer = "${{ steps.ver.outputs.dsh }}"
          python scripts/dsh_patch_compat_check.py `
            --patch brand-patch/@deepseek-ai `
            --base $dshVer --target $dshVer --expect-base $dshVer
          if ($LASTEXITCODE -ne 0) { throw "补丁基线校验未通过（期望 baseline=$dshVer）" }
          Write-Host "补丁基线校验通过: $dshVer"

      - name: 生成就绪标记并清理
        shell: pwsh
        run: |
          "node=${{ steps.ver.outputs.node }}`ndsh=${{ steps.ver.outputs.dsh }}`ncreated=$(Get-Date -Format 'o')" |
            Out-File -FilePath .ready.flag -Encoding ASCII
          # 清理：npm 缓存与临时解压目录不入包
          Remove-Item .cache/npm-cache, .cache/runtimes/_extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path data/dsh, data/logs | Out-Null
          Get-Content .ready.flag

      - name: 压缩为完整包
        shell: pwsh
        run: |
          Compress-Archive -Path launch.bat, launch.sh, LICENSE, README.md, CHANGELOG.md, `
            brand-patch, config, docs, scripts, .cache, data, .ready.flag, .gitattributes, .gitignore `
            -DestinationPath USB-Harness-with-runtime.zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item USB-Harness-with-runtime.zip).Length / 1MB, 1)
          "size=$mb" >> $env:GITHUB_OUTPUT
          Write-Host "压缩包: $mb MB"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: USB Harness ${{ github.ref_name }} — 完整包（含运行时，下载即用）
          body_path: .github/RELEASE_NOTES.md
          files: USB-Harness-with-runtime.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
