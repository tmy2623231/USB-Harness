name: 安装冒烟测试

# 每次推送 / 手动触发：在干净环境完整走一遍「从零安装 → 启动 → HTTP 探测」，
# 目的是捕获 release.yml 构建测不出来的运行期问题（缺模块、版本冲突、启动崩溃）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取锁定版本
        id: ver
        shell: pwsh
        run: |
          $ps1 = Get-Content scripts/setup-windows.ps1 -Raw
          $node = [regex]::Match($ps1, "\`$NodeVersion\s*=\s*'([^']+)'").Groups[1].Value
          $dsh  = [regex]::Match($ps1, "\`$DshVersion\s*=\s*'([^']+)'").Groups[1].Value
          if (-not $node -or -not $dsh) { throw "无法解析版本号" }
          "node=$node"  >> $env:GITHUB_OUTPUT
          "dsh=$dsh"    >> $env:GITHUB_OUTPUT
          Write-Host "Node=$node  dsh=$dsh"

      - name: 下载并解压便携 Node.js
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.node }}"
          New-Item -ItemType Directory -Force -Path .cache/runtimes/windows-x64, .cache/downloads | Out-Null
          $zip = ".cache/downloads/node-v$v-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive $zip -DestinationPath .cache/runtimes/_extract -Force
          Move-Item ".cache/runtimes/_extract/node-v$v-win-x64" .cache/runtimes/windows-x64/node
          & .cache/runtimes/windows-x64/node/node.exe -v

      - name: 从安装脚本解析 peer 列表并安装
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $npm = ".cache/runtimes/windows-x64/node/npm.cmd"
          $ps1 = Get-Content scripts/setup-windows.ps1 -Raw

          $dshVer = "${{ steps.ver.outputs.dsh }}"
          $m = [regex]::Match($ps1, '\$PeerFix\s*=\s*@\((.*?)\n\s*\)',
                [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $m.Success) { throw "无法解析 PeerFix 列表" }
          # $PeerFix 里 dsh 子包用双引号（要插值 $peerVer）、第三方包用单引号，
          # 两种都要收；只匹配单引号会漏掉全部子包（历史缺陷，曾致 71 项被静默丢弃）。
          $peers = @([regex]::Matches($m.Groups[1].Value, """([^""]+?)@\`$peerVer""|'([^']+)'") |
                     ForEach-Object {
                       if ($_.Groups[1].Success) { "$($_.Groups[1].Value)@$dshVer" }
                       else { $_.Groups[2].Value }
                     } |
                     Where-Object { $_ -match '[@^]' })
          if ($peers.Count -lt 6) { throw "peer 数量异常: $($peers.Count)" }

          $mismatch = $peers | Where-Object { $_ -match '^@deepseek-ai/dsh-.*@\^(.+)$' -and $Matches[1] -ne $dshVer }
          if ($mismatch) { throw "peer 版本与 dsh@$dshVer 不一致: $($mismatch -join ', ')" }
          Write-Host "peer 数量: $($peers.Count)，版本一致性 ✓"

          & $npm install --prefix .cache/app "@deepseek-ai/dsh@$dshVer" `
            --no-audit --no-fund --fetch-retries=5 --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "dsh 安装失败" }
          & $npm install --prefix .cache/app @peers --no-audit --no-fund --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "peer 补齐失败" }

      - name: 安装完整性断言
        shell: pwsh
        run: |
          $nm = ".cache/app/node_modules"
          if (-not (Test-Path "$nm/.bin/dsh.cmd")) { throw "dsh.cmd 缺失" }
          $react = (& ".cache/runtimes/windows-x64/node/node.exe" -e "console.log(require('./.cache/app/node_modules/react/package.json').version)")
          Write-Host "react 实装: $react"
          if ($react -notmatch '^18\.') { throw "react 版本异常: $react（期望 18.x）" }
          Copy-Item "brand-patch/@deepseek-ai/*" "$nm/@deepseek-ai/" -Recurse -Force
          if (-not (Select-String -Path "$nm/@deepseek-ai/dsh-client-ui-brand-official/lib/client.js" -Pattern 'USB Harness' -Quiet)) {
            throw "品牌补丁未生效"
          }

          # 断言对象直接取自 setup 脚本的 $PeerFix —— 单一数据源。
          # 早先这里是硬编码的 5 个包名，peer 清单重定后 3 个包已不在清单里，
          # 于是 CI 断言与实际安装行为脱节、把自己"证伪"成失败。改为派生后，
          # 这类「清单改了但断言没改」的失效模式在结构上不可能再出现。
          $ps1 = Get-Content scripts/setup-windows.ps1 -Raw
          $m = [regex]::Match($ps1, '\$PeerFix\s*=\s*@\((.*?)\n\s*\)',
                [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $m.Success) { throw "无法解析 PeerFix 列表" }
          $peers = @([regex]::Matches($m.Groups[1].Value, '"(@[^"]+?)@\$peerVer"') |
                     ForEach-Object { $_.Groups[1].Value })
          if ($peers.Count -lt 6) { throw "peer 数量异常: $($peers.Count)" }

          $missing = @()
          foreach ($p in $peers) {
            $sub = $p.Substring($p.LastIndexOf('/') + 1)
            if (-not (Test-Path "$nm/@deepseek-ai/$sub")) { $missing += $p }
          }
          # 另抽查两个非 dsh 命名空间的补位包
          foreach ($p in 'react', 'react-dom') {
            if (-not (Test-Path "$nm/$p")) { $missing += $p }
          }
          if ($missing.Count -gt 0) {
            throw "缺包 $($missing.Count) 个: $($missing -join ', ')"
          }
          Write-Host "安装完整性 ✓（dsh.cmd / react 18 / 品牌补丁 / $($peers.Count) 个 peer 子包全部落地）"

      - name: 启动器 CLI 分支传参断言
        shell: pwsh
        run: |
          # 【为什么必须断言这个】
          # dsh 0.1.5 起取消了默认执行档位：裸跑 `dsh` 直接报
          #   error: --profile <name> is required
          # 而 launch-windows.ps1 的 CLI 分支当时调的正是裸 `dsh`，因此每次必失败。
          # 本地冒烟没抓到，是因为那里的 headless 用例**绕过了启动器**直接调 dsh——
          # 测的是「dsh 能跑 headless」，不是「启动器的 CLI 模式可用」。
          # 这里改为检查**启动器的调用路径本身**，堵住该盲区。
          # 【断言口径 — 只认「怎么启动 dsh」，不认「用哪个包装函数」】
          # 本断言要验的是「启动 dsh 时带了 --profile headless」。
          # 历史上 Start-Cli 用 `Invoke-Dsh --profile headless $task` 实现，所以早期断言
          # 写死了 "Invoke-Dsh"。但 0.1.5-rc.2.5 为了分离 stdout/stderr 改用了
          # .NET Process 直接拉起 node，那条 `Invoke-Dsh ...` 调用行就消失了 ——
          # 断言立刻误报失败，而实际行为**比原来更正确**。
          # 这说明旧断言把「实现方式」当成了「验收条件」。
          # 改为：先剥掉注释与纯输出行，再在剩余可执行行里找 --profile headless，
          # 避免命中文件里自己写的提示文案（否则断言会被自己的 doc 字符串满足）。
          $ps1 = Get-Content 'scripts/launch-windows.ps1' -Raw
          # 抓 Start-Cli 函数体（到下一个顶层 function 为止）
          $m = [regex]::Match($ps1, 'function\s+Start-Cli\s*\{(.*?)\n\}\s*\n', `
                [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $m.Success) { throw "无法从 launch-windows.ps1 解析出 Start-Cli 函数体" }
          $body = $m.Groups[1].Value

          # 剥离注释行与纯输出行，只留可执行行
          $execLines = $body -split "`r?`n" | Where-Object {
            $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*(echo|Write-Host|Write-Step|printf)\b'
          }
          $execOnly = $execLines -join "`n"

          if ($execOnly -notmatch '--profile\s+headless') {
            throw "Start-Cli 启动 dsh 时未传 --profile headless（裸跑必报 --profile is required）"
          }
          if ($execOnly -match '2>&1\s*\|') {
            throw "Start-Cli 出现 stdout/stderr 混流（2>&1 | ...）：headless 的推理过程会污染最终答案"
          }
          # 记录实际采用的启动方式，便于人工核对（不参与判定）
          if ($execOnly -match 'ProcessStartInfo') {
            Write-Host "启动器 CLI 传参 ✓（已显式传 --profile headless；经 .NET Process 启动以分离双流）"
          } else {
            Write-Host "启动器 CLI 传参 ✓（已显式传 --profile headless）"
          }

      - name: 补丁浏览器端模块可求值断言
        shell: pwsh
        run: |
          # 【为什么必须断言这个】
          # brand-patch 下的 client.js 是**整文件快照**，其中的定制若引用了
          # 未声明的标识符，只会在**浏览器端运行时**炸：
          #   ReferenceError: t is not defined
          # 症状是 Web 页面整页 "Failed to load plugins"。
          #
          # 为什么既有检查挡不住：
          #   * `node --check` 只做语法解析，跨行引用错误查不出；
          #   * CLI 侧（--version / --help / headless）根本不加载浏览器端 bundle，
          #     所以 CLI 冒烟全绿也可能是 Web 整页白屏；
          #   * 补丁基线断言只回答「定制意图在不在」，不回答「代码能不能跑」。
          #
          # 实测事故：dsh-client-ui-permission-presets/lib/client.js 里定制往控制器
          # 穿了 locale 查找函数 t，却漏把它加进构造函数形参。
          # 本步骤真的把模块求值一次，让它自己跑出错误。
          $tool = '.patch-tools/eval-client-module.mjs'
          $mod  = 'brand-patch/@deepseek-ai/dsh-client-ui-permission-presets/lib/client.js'
          if (-not (Test-Path $tool)) { throw "找不到求值工具 $tool" }
          if (-not (Test-Path $mod))  { throw "找不到被检模块 $mod" }
          $out = & node $tool $mod 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'ReferenceError|SyntaxError|FAIL') {
            throw "补丁浏览器端模块求值失败（见上方日志）"
          }
          if ($out -notmatch 'PASS|SKIP') {
            throw "补丁浏览器端模块求值未给出明确结论"
          }
          Write-Host "补丁浏览器端模块可求值 ✓"

      - name: 补丁基线断言
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $dshVer = "${{ steps.ver.outputs.dsh }}"
          python scripts/dsh_patch_compat_check.py `
            --patch brand-patch/@deepseek-ai `
            --base $dshVer --target $dshVer --expect-base $dshVer
          if ($LASTEXITCODE -ne 0) { throw "补丁基线校验未通过" }

      - name: 就绪标记生成（走真实 setup 脚本路径，验证 harness 行）
        shell: pwsh
        run: |
          # 模拟 release.yml 打包前写入 HARNESS_VERSION；setup 检测到 Node/dsh 已存在
          # 会跳过 [1/3][2/3]，直接执行 [3/3] 品牌补丁 + 就绪标记（含 harness= 行）
          $tag = 'v-smoke-test'
          Set-Content -Path HARNESS_VERSION -Value $tag -Encoding ASCII -NoNewline
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "setup-windows.ps1 退出码 $LASTEXITCODE" }
          if (-not (Test-Path HARNESS_VERSION)) { throw "HARNESS_VERSION 文件缺失" }
          $line = (Get-Content .ready.flag) -replace "`r", '' |
                  Where-Object { $_ -like 'harness=*' } | Select-Object -First 1
          if (-not $line -or $line.Substring(8).Trim() -ne $tag) {
            throw "就绪标记缺少 harness= 行或值不正确: '$line'"
          }
          Write-Host "就绪标记含 harness=$($line.Substring(8).Trim()) ✓（HARNESS_VERSION=$tag）"

      - name: 启动 dsh web 并探测 HTTP 200
        shell: pwsh
        run: |
          $env:DSH_HOME = "$PWD/data/dsh"
          $env:Path = "$PWD/.cache/runtimes/windows-x64/node;$env:Path"
          New-Item -ItemType Directory -Force -Path "$env:DSH_HOME", data/logs | Out-Null

          $out = "$PWD/data/logs/dsh-stdout.log"
          $err = "$PWD/data/logs/dsh-stderr.log"
          $proc = Start-Process -FilePath "$PWD/.cache/app/node_modules/.bin/dsh.cmd" `
            -ArgumentList "web","--port","3080","--no-open","--host","127.0.0.1" `
            -RedirectStandardOutput $out -RedirectStandardError $err `
            -PassThru -NoNewWindow
          Write-Host "dsh web 已启动 (pid=$($proc.Id))，轮询 180 秒 ..."

          # 【关键】dsh web 有 browser-trust fence：
          #   裸 URL          -> HTTP 401（且 Invoke-WebRequest 对非 2xx 会 **抛异常**）
          #   带正确 token    -> HTTP 303 + Set-Cookie（token 换会话 cookie）
          #   带 cookie       -> HTTP 200（真正的首页）
          # 因此**不能**用「裸 URL 返回 200」作为就绪判据——那永远等不到。
          # 之前这里正是这么写的，导致本地冒烟全绿而 CI 必然超时失败。
          # 正确做法：先从服务端日志里取出它打印的 URL（含 token），再走完整个握手。
          $ok = $false
          $lastErr = ""
          $status = 0
          $token = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { break }

            # 每轮重新读日志：服务端就绪后才打印带 token 的 URL 行
            if (-not $token) {
              $logText = (Get-Content $out, $err -ErrorAction SilentlyContinue) -join "`n"
              $mt = [regex]::Match($logText, 'token=([A-Za-z0-9_\-]+)')
              if ($mt.Success) { $token = $mt.Groups[1].Value }
            }
            if (-not $token) { continue }

            try {
              # 1) 带 token 访问 -> 303 + Set-Cookie，-SessionVariable 自动吸收会话 cookie
              $r1 = Invoke-WebRequest "http://127.0.0.1:3080/?token=$token" -UseBasicParsing `
                      -TimeoutSec 5 -MaximumRedirection 0 -SessionVariable sess -ErrorAction Stop
              $status = [int]$r1.StatusCode
            } catch {
              # 303 在 -MaximumRedirection 0 下会抛异常，状态码在异常响应里
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              else { $lastErr = $_.Exception.Message }
            }

            if ($status -eq 303 -or $status -eq 200) {
              try {
                # 2) 带会话 cookie 再请求一次 -> 200
                $r2 = Invoke-WebRequest "http://127.0.0.1:3080/" -UseBasicParsing `
                        -TimeoutSec 5 -WebSession $sess -ErrorAction Stop
                if ([int]$r2.StatusCode -eq 200) { $ok = $true; break }
              } catch { $lastErr = $_.Exception.Message }
            }
          }

          Write-Host "--- stdout ---";  Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 25
          Write-Host "--- stderr ---";  Get-Content $err -ErrorAction SilentlyContinue | Select-Object -First 25

          if ($proc.HasExited) { throw "dsh web 进程提前退出（退出码 $($proc.ExitCode)）" }
          if (-not $token) { throw "服务端 180 秒内未打印含 token 的就绪 URL，最后错误: $lastErr" }
          if (-not $ok) { throw "dsh web 180 秒内未就绪（token 握手最后状态码=$status），最后错误: $lastErr" }
          Write-Host "dsh web HTTP 200 ✓（等待 $([math]::Round(($i+1)*3)) 秒；token->303->cookie->200 全链路通过）"

          $badLog = Get-Content $out,$err -ErrorAction SilentlyContinue |
                    Select-String -Pattern "ERR_MODULE_NOT_FOUND","Cannot find module" -Quiet
          if ($badLog) { throw "启动日志含模块缺失错误" }
          Write-Host "启动日志无模块缺失错误 ✓"

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "冒烟测试全部通过 ✓"

      - name: 回归测试：dsh 不依赖 PATH 找 node（Windows）
        shell: pwsh
        run: |
          # RT：干净机器/旧系统 node 两种环境下，launch status 必须仍解析到便携 node。
          # 历史事故：launch-windows.ps1 75 行 & $DshCmd --version 报「node 不是内部或
          # 外部命令」/ Object.hasOwn is not a function。本步失败 = 有人改回了垫片调用。
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-node-resolution.ps1
          if ($LASTEXITCODE -ne 0) { throw "node 解析回归测试未通过（退出码 $LASTEXITCODE）" }
          Write-Host "node 解析回归测试通过 ✓"

  regression-node-resolution-unix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（RT 需要真实 node 充当「便携 node」）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 回归测试：dsh 不依赖 PATH 找 node（Linux）
        shell: bash
        run: |
          # 与 Windows 版同构的 RT：干净机器/旧系统 node 两种环境下，launch.sh status
          # 必须仍解析到便携 node。历史事故：.bin/dsh 垫片（#!/usr/bin/env node）
          # 报 "command not found: node" / Object.hasOwn is not a function。
          bash scripts/tests/test-node-resolution.sh
