# =============================================================================
# dsh 运行模式（USB Harness 控制台）
# =============================================================================
# 由启动器菜单 [4] 切换；本文件是运行模式唯一的持久化位置，
# Windows（launch-windows.ps1）与 Linux/macOS（launch.sh）共用同一格式。
#
# 字段：
#   mode = web      启动 Web 界面（图形化，默认）
#   mode = cli      启动 dsh 命令行交互模式（TUI）
#
# 说明：
#   - 默认值 web。本文件不存在、为空、或字段值无法识别时，一律按 web 处理，
#     因此删除本文件即可恢复默认，不会影响任何既有行为。
#   - 本文件由启动器自动生成/改写，手工编辑同样有效。
#   - 仅影响「启动」这一动作的目标；不影响 dsh 版本、数据目录、模型配置等。
# =============================================================================
mode = web
